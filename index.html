<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Tracker</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1c1c1e;
            --primary-color: #0a84ff;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #38383a;
            --danger-color: #ff453a;
            --success-color: #30d158;
            --border-radius: 16px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        h1, h2 { font-weight: 700; margin-bottom: var(--spacing-md); font-size: 28px;}
        h3 { font-size: 20px; margin-bottom: var(--spacing-sm); }
        h4 { font-size: 16px; margin-bottom: var(--spacing-sm); font-weight: 600; }
        
        .header-container {
            padding: var(--spacing-lg) var(--spacing-md) var(--spacing-md);
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        .screen {
            display: none;
            padding: 0 var(--spacing-md) var(--spacing-md);
            animation: fadeIn 0.3s ease;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            background-color: #2c2c2e;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 17px;
            margin-bottom: var(--spacing-sm);
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary-color); }
        
        .input-row {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        button.secondary { background-color: #2c2c2e; color: var(--text-main); }
        button.danger { background-color: rgba(255, 69, 58, 0.1); color: var(--danger-color); }
        button.ghost { background: transparent; color: var(--primary-color); padding: 0; width: auto; font-size: 15px;}

        .set-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            gap: var(--spacing-sm);
            align-items: center;
            padding-top: var(--spacing-sm);
            border-top: 1px solid var(--border-color);
            margin-top: var(--spacing-sm);
        }
        .set-row input { margin-bottom: 0; text-align: center; padding: 12px 8px; font-weight: 600; }
        .ghost-text { font-size: 14px; color: var(--text-muted); text-align: right; line-height: 1.2; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            z-index: 100;
        }
        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 33%;
        }
        .nav-item.active { color: var(--primary-color); }
        .nav-icon { font-size: 24px; }

        .history-entry { 
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .history-entry:last-child { border-bottom: none; }
        .history-date { font-weight: 600; margin-bottom: 6px; font-size: 15px; color: var(--primary-color);}
        .history-sets { font-size: 15px; color: var(--text-main); }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mt-4 { margin-top: 16px; }
        
        .ex-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;}
    </style>
</head>
<body>

    <div id="workout-screen" class="screen active">
        <div class="header-container">
            <h2>Тренировка</h2>
        </div>
        <div id="workout-day-selector">
            </div>
        
        <div id="active-workout-container" style="display: none;">
            <div class="flex-between card" style="background: var(--primary-color); border: none;">
                <h3 id="active-workout-title" style="margin:0; color: white;"></h3>
                <button class="ghost" style="color: white; font-weight: 600;" onclick="cancelWorkout()">Отмена</button>
            </div>
            <div id="workout-exercises-list">
                </div>
            <button onclick="finishWorkout()" style="margin-top: 16px; background-color: var(--success-color);">🏁 Завершить тренировку</button>
        </div>
    </div>

    <div id="stats-screen" class="screen">
        <div class="header-container">
            <h2>Динамика</h2>
        </div>
        <select id="stats-exercise-select" onchange="renderStatsLog()">
            <option value="">Выберите упражнение</option>
        </select>
        <div class="card" id="stats-log-container">
            <p style="color: var(--text-muted); text-align: center; padding: 20px 0;">Выберите упражнение для просмотра истории.</p>
        </div>
    </div>

    <div id="setup-screen" class="screen">
        <div class="header-container">
            <h2>Сплит</h2>
        </div>
        <div class="card">
            <h4 style="color: var(--text-muted);">Добавить новый день</h4>
            <div class="input-row">
                <input type="text" id="new-day-name" placeholder="Название дня">
                <button class="secondary" style="width: 60px;" onclick="addDay()">+</button>
            </div>
        </div>
        <div id="config-days-list">
            </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('workout')">
            <span class="nav-icon">🏋️‍♂️</span>
            <span>Зал</span>
        </div>
        <div class="nav-item" onclick="switchTab('stats')">
            <span class="nav-icon">📈</span>
            <span>Динамика</span>
        </div>
        <div class="nav-item" onclick="switchTab('setup')">
            <span class="nav-icon">⚙️</span>
            <span>Сплит</span>
        </div>
    </nav>

    <script>
        const TARGET_SETS = 3;

        // Базовый сплит
        const defaultSplit = [
            {
                id: 'day_1',
                name: 'День первый',
                exercises: [
                    'Тяга штанги в наклоне',
                    'Тяга горизонтального блока с широкой рукояткой',
                    'Жим штанги лежа',
                    'Махи на среднюю дельту',
                    'Махи гантелей на заднюю дельту лицом в наклонную скамью',
                    'Сгибание руки с гантелей в тренажере Скотта',
                    'Пресс на наклонной скамье с отягощением',
                    'Разгибание рук в кроссовере с прямой рукояткой (трицепс)'
                ]
            },
            {
                id: 'day_2',
                name: 'День второй',
                exercises: [
                    'Подтягивания',
                    'Прожимание гантелей на наклонной скамье на спину (Бамстед стайл)',
                    'Жим гантелей на наклонной скамье',
                    'Протяжка с гантелями на среднюю дельту',
                    'Тяга штанги на заднюю дельту на наклонной скамье',
                    'Сгибание рук со штангой (Бицепс)',
                    'Скручивание с канатами (на пресс)'
                ]
            },
            {
                id: 'day_3',
                name: 'День третий',
                exercises: [
                    'Тяга в кроссовере по одной руке',
                    'Пулловер',
                    'Тяга вертикального блока, широкой рукояткой с прожиманием спины',
                    'Жим в наклонной скамье',
                    'Махи с гантелями на среднюю дельту',
                    'Тяга каната на уровень глаз на заднюю дельту',
                    'Сгибание рук на бицепс в кроссовере',
                    'Разгибание рук с гантелью сидя (трицепс)',
                    'Поднимание ног на пресс'
                ]
            }
        ];

        let appData = {
            config: [],
            history: [] 
        };

        let currentWorkout = {
            dayId: null,
            results: {} 
        };

        // --- ИНИЦИАЛИЗАЦИЯ И ХРАНЕНИЕ ---
        function loadData() {
            try {
                const saved = localStorage.getItem('workoutApp_data');
                if (saved) {
                    const parsedData = JSON.parse(saved);
                    appData.config = parsedData.config || [];
                    appData.history = parsedData.history || [];
                    
                    // Предохранитель: если конфиг загрузился пустым (из-за старого бага)
                    if (appData.config.length === 0) {
                        appData.config = defaultSplit;
                        saveData();
                        return; // saveData сама вызовет updateUI
                    }
                    updateUI(); 
                } else {
                    // Чистый старт
                    appData.config = defaultSplit;
                    saveData();
                }
            } catch (error) {
                console.error("Ошибка загрузки данных", error);
                appData.config = defaultSplit;
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('workoutApp_data', JSON.stringify(appData));
            updateUI();
        }

        // --- НАВИГАЦИЯ ---
        function switchTab(tabName) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`${tabName}-screen`).classList.add('active');
            event.currentTarget.classList.add('active');
            
            if(tabName === 'stats') populateStatsSelect();
        }

        // --- СПЛИТ (SETUP) ---
        function addDay() {
            const nameInput = document.getElementById('new-day-name');
            const name = nameInput.value.trim();
            if (!name) return;

            appData.config.push({
                id: 'day_' + Date.now(),
                name: name,
                exercises: []
            });
            nameInput.value = '';
            saveData();
        }

        function addExerciseToDay(dayId) {
            const input = document.getElementById(`new-ex-${dayId}`);
            const exName = input.value.trim();
            if (!exName) return;

            const day = appData.config.find(d => d.id === dayId);
            if (day && !day.exercises.includes(exName)) {
                day.exercises.push(exName);
                saveData();
            }
        }

        function removeExercise(dayId, exName) {
            if(confirm(`Удалить "${exName}"?`)) {
                const day = appData.config.find(d => d.id === dayId);
                day.exercises = day.exercises.filter(e => e !== exName);
                saveData();
            }
        }

        function deleteDay(dayId) {
            if(confirm("Полностью удалить этот день?")) {
                appData.config = appData.config.filter(d => d.id !== dayId);
                saveData();
            }
        }

        // --- БОЕВОЙ РЕЖИМ ---
        function startWorkout(dayId) {
            currentWorkout.dayId = dayId;
            currentWorkout.results = {};
            document.getElementById('workout-day-selector').style.display = 'none';
            document.getElementById('active-workout-container').style.display = 'block';
            
            const day = appData.config.find(d => d.id === dayId);
            document.getElementById('active-workout-title').innerText = day.name;
            renderActiveExercises(day);
            window.scrollTo(0, 0);
        }

        function cancelWorkout() {
            if(confirm("Отменить тренировку? Прогресс не сохранится.")) {
                currentWorkout.dayId = null;
                document.getElementById('workout-day-selector').style.display = 'block';
                document.getElementById('active-workout-container').style.display = 'none';
            }
        }

        function getPreviousResults(dayId, exName) {
            for (let i = appData.history.length - 1; i >= 0; i--) {
                const session = appData.history[i];
                if (session.dayId === dayId && session.results[exName]) {
                    return session.results[exName];
                }
            }
            return null;
        }

        function renderActiveExercises(day) {
            const container = document.getElementById('workout-exercises-list');
            if(!container) return;
            container.innerHTML = '';

            day.exercises.forEach((exName, exIndex) => {
                currentWorkout.results[exName] = []; 
                const prevData = getPreviousResults(day.id, exName);
                
                let setsHtml = '';
                for(let i=0; i<TARGET_SETS; i++) {
                    let ghostW = prevData && prevData[i] ? prevData[i].w : '-';
                    let ghostR = prevData && prevData[i] ? prevData[i].r : '-';
                    let ghostStr = prevData && prevData[i] ? `Было:<br><span style="color:#fff">${ghostW}кг × ${ghostR}</span>` : 'Было:<br>-';
                    
                    setsHtml += `
                        <div class="set-row">
                            <input type="number" inputmode="decimal" placeholder="КГ" id="w_${exIndex}_${i}" onchange="updateSet('${exName}', ${i})">
                            <input type="number" inputmode="numeric" placeholder="ПОВТ" id="r_${exIndex}_${i}" onchange="updateSet('${exName}', ${i})">
                            <div class="ghost-text">${ghostStr}</div>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="card">
                        <div class="ex-header">
                            <h4>${exIndex + 1}. ${exName}</h4>
                        </div>
                        ${setsHtml}
                    </div>
                `;
            });
        }

        function updateSet(exName, setIndex) {
            const exIndex = appData.config.find(d => d.id === currentWorkout.dayId).exercises.indexOf(exName);
            const w = document.getElementById(`w_${exIndex}_${setIndex}`).value;
            const r = document.getElementById(`r_${exIndex}_${setIndex}`).value;
            
            if (!currentWorkout.results[exName]) currentWorkout.results[exName] = [];
            currentWorkout.results[exName][setIndex] = { 
                w: w !== '' ? parseFloat(w) : null, 
                r: r !== '' ? parseInt(r) : null 
            };
        }

        function finishWorkout() {
            let cleanResults = {};
            for (const key in currentWorkout.results) {
                const validSets = currentWorkout.results[key].filter(set => set && (set.w !== null || set.r !== null));
                if (validSets.length > 0) cleanResults[key] = validSets;
            }

            if (Object.keys(cleanResults).length === 0) {
                alert("Ты не записал ни одного подхода.");
                return;
            }
            
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' });
            
            appData.history.push({
                date: dateStr,
                timestamp: now.getTime(),
                dayId: currentWorkout.dayId,
                results: cleanResults
            });
            
            saveData();
            currentWorkout.dayId = null;
            document.getElementById('workout-day-selector').style.display = 'block';
            document.getElementById('active-workout-container').style.display = 'none';
        }

        // --- СТАТИСТИКА ---
        function populateStatsSelect() {
            const select = document.getElementById('stats-exercise-select');
            if(!select) return;
            const currentVal = select.value;
            select.innerHTML = '<option value="">Выберите упражнение</option>';
            
            let allEx = new Set();
            appData.config.forEach(d => d.exercises.forEach(e => allEx.add(e)));
            
            Array.from(allEx).sort().forEach(ex => {
                select.innerHTML += `<option value="${ex}">${ex}</option>`;
            });
            select.value = currentVal; 
        }

        function renderStatsLog() {
            const select = document.getElementById('stats-exercise-select');
            const container = document.getElementById('stats-log-container');
            if(!select || !container) return;
            
            const exName = select.value;
            if (!exName) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px 0;">Выберите упражнение для просмотра истории.</p>';
                return;
            }

            let html = '';
            for (let i = appData.history.length - 1; i >= 0; i--) {
                const session = appData.history[i];
                if (session.results[exName] && session.results[exName].length > 0) {
                    let setsStr = session.results[exName].map(s => `<b>${s.w || 0}</b>x${s.r || 0}`).join(' &nbsp;|&nbsp; ');
                    html += `
                        <div class="history-entry">
                            <div class="history-date">${session.date}</div>
                            <div class="history-sets">${setsStr}</div>
                        </div>
                    `;
                }
            }

            container.innerHTML = html || '<p style="color: var(--text-muted); text-align: center; padding: 20px 0;">Нет сохраненных результатов.</p>';
        }

        // --- РЕНДЕР ИНТЕРФЕЙСА ---
        function updateUI() {
            const configList = document.getElementById('config-days-list');
            const daySelector = document.getElementById('workout-day-selector');
            
            if (configList) {
                configList.innerHTML = '';
                appData.config.forEach(day => {
                    let exHtml = day.exercises.map(ex => `
                        <div class="flex-between" style="margin-bottom:8px; padding-bottom:8px; border-bottom: 1px solid var(--border-color);">
                            <span style="font-size: 14px;">${ex}</span>
                            <button class="ghost" style="color: var(--danger-color); padding: 0 10px;" onclick="removeExercise('${day.id}', '${ex}')">✕</button>
                        </div>
                    `).join('');
                    
                    configList.innerHTML += `
                        <div class="card">
                            <div class="flex-between" style="margin-bottom: 16px;">
                                <h3 style="margin:0; color: var(--primary-color);">${day.name}</h3>
                                <button class="danger" style="width: auto; padding: 6px 12px; font-size: 14px;" onclick="deleteDay('${day.id}')">Удалить</button>
                            </div>
                            <div style="margin-bottom: 16px;">${exHtml}</div>
                            <div class="input-row">
                                <input type="text" id="new-ex-${day.id}" placeholder="Добавить упражнение">
                                <button class="secondary" style="width: 60px;" onclick="addExerciseToDay('${day.id}')">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            if (daySelector) {
                daySelector.innerHTML = '';
                appData.config.forEach(day => {
                    daySelector.innerHTML += `<button class="card" style="text-align: left; background-color: var(--surface-color); color: var(--text-main); font-size: 18px; margin-bottom: 12px;" onclick="startWorkout('${day.id}')">▶ ${day.name}</button>`;
                });
            }
        }

        // ЗАПУСК: Ждем полной загрузки DOM
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>
