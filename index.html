<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Tracker</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1c1c1e;
            --primary-color: #0a84ff;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #38383a;
            --danger-color: #ff453a;
            --success-color: #30d158;
            --border-radius: 16px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        h1, h2 { font-weight: 700; margin-bottom: var(--spacing-md); font-size: 28px;}
        h3 { font-size: 20px; margin-bottom: var(--spacing-sm); }
        h4 { font-size: 16px; margin-bottom: var(--spacing-sm); font-weight: 600; }
        
        .header-container {
            padding: var(--spacing-lg) var(--spacing-md) var(--spacing-md);
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        .screen {
            display: none;
            padding: 0 var(--spacing-md) var(--spacing-md);
            animation: fadeIn 0.3s ease;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            background-color: #2c2c2e;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 17px;
            margin-bottom: var(--spacing-sm);
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary-color); }
        
        .input-row {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        button.secondary { background-color: #2c2c2e; color: var(--text-main); }
        button.danger { background-color: rgba(255, 69, 58, 0.1); color: var(--danger-color); }
        button.ghost { background: transparent; color: var(--primary-color); padding: 0; width: auto; font-size: 15px;}

        .set-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            gap: var(--spacing-sm);
            align-items: center;
            padding-top: var(--spacing-sm);
            border-top: 1px solid var(--border-color);
            margin-top: var(--spacing-sm);
        }
        .set-row input { margin-bottom: 0; text-align: center; padding: 12px 8px; font-weight: 600; }
        .ghost-text { font-size: 14px; color: var(--text-muted); text-align: right; line-height: 1.2; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            z-index: 100;
        }
        .nav-item {
            color: var(--text-muted);
