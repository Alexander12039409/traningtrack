<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дневник Тренировок</title>
    <!-- Подключаем API Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Цветовая палитра */
            --bg-color: #0e100f; 
            --surface-color: #1a1d1b; 
            --surface-light: #252a27; 
            --primary-color: #d4ff3a; 
            --text-main: #ffffff;
            --text-muted: #8b928c;
            --text-on-primary: #000000;
            --danger-color: #ff453a;
            
            /* Скругления и отступы */
            --border-radius: 28px;
            --border-radius-sm: 16px;
            --spacing-sm: 12px;
            --spacing-md: 20px;
            --spacing-lg: 32px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 120px; 
            overflow-x: hidden;
        }

        h1, h2 { font-weight: 700; margin-bottom: var(--spacing-md); font-size: 32px; letter-spacing: -0.5px;}
        h3 { font-size: 22px; margin-bottom: var(--spacing-sm); font-weight: 600;}
        h4 { font-size: 17px; margin-bottom: 4px; font-weight: 600; letter-spacing: -0.3px;}
        
        .header-container {
            padding: var(--spacing-lg) var(--spacing-md) var(--spacing-sm);
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, var(--bg-color) 60%, transparent 100%);
            z-index: 50;
        }

        .screen {
            display: none;
            padding: 0 var(--spacing-md) var(--spacing-md);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Карточки */
        .card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Инпуты */
        input[type="text"], input[type="number"] {
            width: 100%;
            background-color: var(--surface-light);
            border: 2px solid transparent;
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: var(--border-radius-sm);
            font-size: 17px;
            font-weight: 500;
            margin-bottom: var(--spacing-sm);
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus { 
            border-color: var(--primary-color); 
            background-color: var(--surface-color);
        }
        
        .input-row {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        /* Кнопки */
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--text-on-primary);
            border: none;
            padding: 18px;
            border-radius: 100px; 
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        button:active { transform: scale(0.97); }
        button.secondary { background-color: var(--surface-light); color: var(--text-main); }
        button.danger { background-color: rgba(255, 69, 58, 0.1); color: var(--danger-color); }
        button.ghost { background: transparent; color: var(--primary-color); padding: 0; width: auto; font-size: 15px;}

        /* Сетка подходов */
        .set-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: var(--spacing-sm);
            align-items: center;
            padding-top: var(--spacing-sm);
            margin-top: var(--spacing-sm);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .set-row input { 
            margin-bottom: 0; 
            text-align: center; 
            padding: 14px 8px; 
            font-size: 20px;
            font-weight: 700; 
        }
        .ghost-text { 
            font-size: 13px; 
            color: var(--text-muted); 
            text-align: right; 
            line-height: 1.3; 
            background: var(--surface-light);
            padding: 8px 12px;
            border-radius: 12px;
        }

        /* Парящий Tab Bar */
        .bottom-nav-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 0 16px 32px 16px;
            z-index: 100;
            pointer-events: none; 
        }

        .bottom-nav {
            background-color: var(--surface-color);
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            pointer-events: auto; 
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            width: 56px;
            height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-item.active { 
            background-color: var(--primary-color); 
            color: var(--text-on-primary); 
            transform: scale(1.05);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2.2;
        }

        /* Компоненты шторки (Drawer) */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .drawer-overlay.active { opacity: 1; pointer-events: all; }
        
        .bottom-drawer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--surface-color); border-radius: 32px 32px 0 0;
            padding: 24px 20px 40px; z-index: 1001;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 85vh; display: flex; flex-direction: column;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        .bottom-drawer.active { transform: translateY(0); }
        
        .drawer-handle {
            width: 40px; height: 5px; background: var(--text-muted);
            border-radius: 10px; margin: 0 auto 20px; opacity: 0.5;
        }
        
        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .drawer-content {
            overflow-y: auto; flex-grow: 1; padding-bottom: env(safe-area-inset-bottom);
        }

        /* Список в шторке */
        .drawer-list-item {
            padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 16px; font-weight: 500; color: var(--text-main);
            display: flex; justify-content: space-between; align-items: center;
        }
        .drawer-list-item:active { background-color: var(--surface-light); border-radius: 12px; }
        .drawer-list-item:last-child { border-bottom: none; }

        /* История и Календарь */
        .history-entry { 
            padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .history-entry:last-child { border-bottom: none; }
        .history-date { font-weight: 700; margin-bottom: 8px; font-size: 16px; color: var(--primary-color);}
        .history-sets { font-size: 15px; color: var(--text-main); }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mt-4 { margin-top: 16px; }
        
        .badge {
            background-color: var(--primary-color); color: var(--text-on-primary);
            font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 100px;
            text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Тренировка -->
    <div id="workout-screen" class="screen active">
        <div class="header-container">
            <h2>Тренировка</h2>
        </div>

        <!-- Виджет "Твой рекорд" -->
        <div id="highlight-widget" style="display: none;"></div>

        <div id="workout-day-selector"></div>
        
        <div id="active-workout-container" style="display: none;">
            <div class="flex-between card" style="background: var(--primary-color); border: none;">
                <div>
                    <span style="color: rgba(0,0,0,0.6); font-size: 13px; font-weight: 700; text-transform: uppercase;">Текущий план</span>
                    <h3 id="active-workout-title" style="margin:0; color: var(--text-on-primary); font-size: 24px;"></h3>
                </div>
                <button class="ghost" style="color: var(--text-on-primary); font-weight: 700; background: rgba(0,0,0,0.1); padding: 10px 16px; border-radius: 20px;" onclick="cancelWorkout()">Отмена</button>
            </div>
            <div id="workout-exercises-list"></div>
            <button onclick="finishWorkout()" style="margin-top: 24px; font-size: 18px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Завершить тренировку
            </button>
        </div>
    </div>

    <!-- ЭКРАН 2: Аналитика (Графики) -->
    <div id="stats-screen" class="screen">
        <div class="header-container">
            <h2>Динамика</h2>
        </div>
        <div class="card">
            <!-- Кнопка вместо селекта для открытия шторки -->
            <button class="secondary" style="justify-content: space-between; border-radius: 16px; font-weight: 600;" onclick="openStatsSelector()">
                <span id="stats-selected-ex" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Выберите упражнение</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
        </div>
        <div class="card" id="stats-log-container">
            <p style="color: var(--text-muted); text-align: center; padding: 40px 0; font-weight: 500;">Выберите упражнение выше, чтобы увидеть историю.</p>
        </div>
    </div>

    <!-- ЭКРАН 3: Общая История и Календарь -->
    <div id="history-screen" class="screen">
        <div class="header-container">
            <h2>История</h2>
        </div>
        
        <!-- Календарь -->
        <div class="card" id="calendar-container"></div>

        <div id="history-list-container">
            <!-- Сюда рендерятся все прошедшие тренировки лентой -->
        </div>
    </div>

    <!-- ЭКРАН 4: Конфигуратор -->
    <div id="setup-screen" class="screen">
        <div class="header-container">
            <h2>Сплит</h2>
        </div>
        <div class="card" style="background: var(--primary-color);">
            <h4 style="color: var(--text-on-primary); margin-bottom: 12px;">Добавить новый день</h4>
            <div class="input-row" style="margin:0;">
                <input type="text" id="new-day-name" placeholder="Например: День ног" style="background: rgba(0,0,0,0.1); color: #000;">
                <button style="width: 60px; background: #000; color: var(--primary-color); border-radius: 16px;" onclick="addDay()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </div>
        <div id="config-days-list"></div>
    </div>

    <!-- ШТОРКА (DRAWER) -->
    <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
    <div id="bottom-drawer" class="bottom-drawer">
        <div class="drawer-handle"></div>
        <div class="drawer-header">
            <h3 id="drawer-title" style="margin:0; font-size: 22px;"></h3>
            <button class="ghost" style="color: var(--text-muted); background: var(--surface-light); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;" onclick="closeDrawer()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div id="drawer-content" class="drawer-content"></div>
    </div>

    <!-- Парящая Навигация -->
    <div class="bottom-nav-container">
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('workout')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <div class="nav-item" onclick="switchTab('stats')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            </div>
            <div class="nav-item" onclick="switchTab('history')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            <div class="nav-item" onclick="switchTab('setup')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </nav>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        const TARGET_SETS = 3;
        let currentCalDate = new Date(); // Для календаря
        let currentStatsEx = ""; // Для выбранного упражнения в статистике

        const defaultSplit = [
            {
                id: 'day_1',
                name: 'День первый',
                exercises: [
                    'Тяга штанги в наклоне',
                    'Тяга горизонтального блока с широкой рукояткой',
                    'Жим штанги лежа',
                    'Махи на среднюю дельту',
                    'Махи гантелей на заднюю дельту лицом в наклонную скамью',
                    'Сгибание руки с гантелей в тренажере Скотта',
                    'Пресс на наклонной скамье с отягощением',
                    'Разгибание рук в кроссовере с прямой рукояткой (трицепс)'
                ]
            },
            {
                id: 'day_2',
                name: 'День второй',
                exercises: [
                    'Подтягивания',
                    'Прожимание гантелей на наклонной скамье на спину (Бамстед стайл)',
                    'Жим гантелей на наклонной скамье',
                    'Протяжка с гантелями на среднюю дельту',
                    'Тяга штанги на заднюю дельту на наклонной скамье',
                    'Сгибание рук со штангой (Бицепс)',
                    'Скручивание с канатами (на пресс)'
                ]
            },
            {
                id: 'day_3',
                name: 'День третий',
                exercises: [
                    'Тяга в кроссовере по одной руке',
                    'Пулловер',
                    'Тяга вертикального блока, широкой рукояткой с прожиманием спины',
                    'Жим в наклонной скамье',
                    'Махи с гантелями на среднюю дельту',
                    'Тяга каната на уровень глаз на заднюю дельту',
                    'Сгибание рук на бицепс в кроссовере',
                    'Разгибание рук с гантелью сидя (трицепс)',
                    'Поднимание ног на пресс'
                ]
            }
        ];

        let appData = { config: [], history: [] };
        let currentWorkout = { dayId: null, results: {} };

        // --- УПРАВЛЕНИЕ ШТОРКОЙ ---
        function openDrawer(title, contentHtml) {
            document.getElementById('drawer-title').innerText = title;
            document.getElementById('drawer-content').innerHTML = contentHtml;
            document.getElementById('drawer-overlay').classList.add('active');
            document.getElementById('bottom-drawer').classList.add('active');
        }

        function closeDrawer() {
            document.getElementById('drawer-overlay').classList.remove('active');
            document.getElementById('bottom-drawer').classList.remove('active');
            // Очищаем через таймаут, чтобы анимация успела проиграться
            setTimeout(() => { document.getElementById('drawer-content').innerHTML = ''; }, 300);
        }

        // --- ДАННЫЕ ---
        function loadData() {
            if (tg.initDataUnsafe && Object.keys(tg.initDataUnsafe).length > 0) {
                tg.CloudStorage.getItem('workoutApp_data', (err, saved) => {
                    if (!saved || saved.length === 0) {
                        const oldLocalData = localStorage.getItem('workoutApp_data');
                        if (oldLocalData) {
                            handleLoadedData(oldLocalData);
                            saveData(); 
                            return;
                        }
                    }
                    handleLoadedData(saved);
                });
            } else {
                const saved = localStorage.getItem('workoutApp_data');
                handleLoadedData(saved);
            }
        }

        function handleLoadedData(saved) {
            try {
                if (saved) {
                    const parsedData = JSON.parse(saved);
                    appData.config = parsedData.config || [];
                    appData.history = parsedData.history || [];
                    
                    if (appData.config.length === 0) {
                        appData.config = defaultSplit;
                        saveData();
                        return;
                    }
                    updateUI(); 
                } else {
                    appData.config = defaultSplit;
                    saveData();
                }
            } catch (error) {
                console.error("Ошибка загрузки данных", error);
                appData.config = defaultSplit;
                saveData();
            }
        }

        function saveData() {
            const dataStr = JSON.stringify(appData);
            if (tg.initDataUnsafe && Object.keys(tg.initDataUnsafe).length > 0) {
                tg.CloudStorage.setItem('workoutApp_data', dataStr, (err, success) => {});
            } else {
                localStorage.setItem('workoutApp_data', dataStr);
            }
            updateUI();
        }

        // --- НАВИГАЦИЯ ---
        function switchTab(tabName) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`${tabName}-screen`).classList.add('active');
            event.currentTarget.classList.add('active');
            
            if(tabName === 'history') renderHistoryTab();
        }

        // --- БОЕВОЙ РЕЖИМ ---
        function startWorkout(dayId) {
            currentWorkout.dayId = dayId;
            currentWorkout.results = {};
            document.getElementById('workout-day-selector').style.display = 'none';
            document.getElementById('highlight-widget').style.display = 'none';
            document.getElementById('active-workout-container').style.display = 'block';
            
            const day = appData.config.find(d => d.id === dayId);
            document.getElementById('active-workout-title').innerText = day.name;
            renderActiveExercises(day);
            window.scrollTo(0, 0);
        }

        function cancelWorkout() {
            if(confirm("Отменить тренировку? Прогресс не сохранится.")) {
                currentWorkout.dayId = null;
                document.getElementById('workout-day-selector').style.display = 'block';
                renderHighlightWidget(); // Возвращаем виджет
                document.getElementById('active-workout-container').style.display = 'none';
            }
        }

        function getPreviousResults(dayId, exName) {
            for (let i = appData.history.length - 1; i >= 0; i--) {
                const session = appData.history[i];
                if (session.dayId === dayId && session.results[exName]) return session.results[exName];
            }
            return null;
        }

        function renderActiveExercises(day) {
            const container = document.getElementById('workout-exercises-list');
            container.innerHTML = '';

            day.exercises.forEach((exName, exIndex) => {
                currentWorkout.results[exName] = []; 
                const prevData = getPreviousResults(day.id, exName);
                
                let setsHtml = '';
                for(let i=0; i<TARGET_SETS; i++) {
                    let ghostW = prevData && prevData[i] ? prevData[i].w : '-';
                    let ghostR = prevData && prevData[i] ? prevData[i].r : '-';
                    let ghostStr = prevData && prevData[i] ? `Было:<br><span style="color:#fff">${ghostW}кг × ${ghostR}</span>` : 'Было:<br>-';
                    
                    setsHtml += `
                        <div class="set-row">
                            <input type="number" inputmode="decimal" placeholder="КГ" id="w_${exIndex}_${i}" onchange="updateSet('${exName}', ${i})">
                            <input type="number" inputmode="numeric" placeholder="ПОВТ" id="r_${exIndex}_${i}" onchange="updateSet('${exName}', ${i})">
                            <div class="ghost-text">${ghostStr}</div>
                        </div>
                    `;
                }
                container.innerHTML += `<div class="card"><div class="badge">Упражнение ${exIndex + 1}</div><h4>${exName}</h4>${setsHtml}</div>`;
            });
        }

        function updateSet(exName, setIndex) {
            const exIndex = appData.config.find(d => d.id === currentWorkout.dayId).exercises.indexOf(exName);
            const w = document.getElementById(`w_${exIndex}_${setIndex}`).value;
            const r = document.getElementById(`r_${exIndex}_${setIndex}`).value;
            
            if (!currentWorkout.results[exName]) currentWorkout.results[exName] = [];
            currentWorkout.results[exName][setIndex] = { w: w !== '' ? parseFloat(w) : null, r: r !== '' ? parseInt(r) : null };
        }

        function finishWorkout() {
            let cleanResults = {};
            for (const key in currentWorkout.results) {
                const validSets = currentWorkout.results[key].filter(set => set && (set.w !== null || set.r !== null));
                if (validSets.length > 0) cleanResults[key] = validSets;
            }
            if (Object.keys(cleanResults).length === 0) {
                alert("Ты не записал ни одного подхода.");
                return;
            }
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' });
            
            appData.history.push({ date: dateStr, timestamp: now.getTime(), dayId: currentWorkout.dayId, results: cleanResults });
            saveData();
            
            currentWorkout.dayId = null;
            document.getElementById('workout-day-selector').style.display = 'block';
            document.getElementById('active-workout-container').style.display = 'none';
        }

        // --- ВИДЖЕТ РЕКОРДОВ ---
        function renderHighlightWidget() {
            const container = document.getElementById('highlight-widget');
            if (appData.history.length === 0) {
                container.style.display = 'none';
                return;
            }

            // Собираем все уникальные упражнения из истории
            let allEx = new Set();
            appData.history.forEach(h => Object.keys(h.results).forEach(e => allEx.add(e)));
            let exArray = Array.from(allEx);
            if(exArray.length === 0) return;

            // Выбираем случайное упражнение
            let randomEx = exArray[Math.floor(Math.random() * exArray.length)];
            let bestW = 0; let bestR = 0; let bestTimestamp = 0;

            // Ищем лучший результат (макс вес, при равенстве - макс повторы)
            appData.history.forEach(h => {
                if(h.results[randomEx]) {
                    h.results[randomEx].forEach(set => {
                        if(set.w > bestW || (set.w === bestW && set.r > bestR)) {
                            bestW = set.w; bestR = set.r; bestTimestamp = h.timestamp;
                        }
                    });
                }
            });

            if(bestW === 0 && bestR === 0) return; // Пустой сет

            const dateObj = new Date(bestTimestamp);
            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            const formattedDate = `${days[dateObj.getDay()]}, ${dateObj.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'})}`;

            container.innerHTML = `
                <div class="card" style="background: linear-gradient(135deg, #1c2217 0%, var(--surface-color) 100%); border: 1px solid rgba(212, 255, 58, 0.15); display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div style="font-size: 11px; color: var(--primary-color); margin-bottom: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">Твой рекорд</div>
                        <div style="font-size: 15px; font-weight: 600; color: #ddd; margin-bottom: 8px; line-height: 1.2;">${randomEx}</div>
                        <div style="font-size: 12px; color: var(--text-muted);"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 2px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${formattedDate}</div>
                    </div>
                    <div style="text-align: right; background: var(--surface-light); padding: 12px; border-radius: 20px;">
                        <div style="font-size: 20px; font-weight: 700; color: var(--text-main); white-space: nowrap;">${bestW} кг</div>
                        <div style="font-size: 14px; font-weight: 500; color: var(--text-muted);">× ${bestR}</div>
                    </div>
                </div>
            `;
            container.style.display = 'block';
        }

        // --- ДИНАМИКА (В ШТОРКЕ) ---
        function openStatsSelector() {
            let allEx = new Set();
            appData.config.forEach(d => d.exercises.forEach(e => allEx.add(e)));
            let exArray = Array.from(allEx).sort();
            
            let html = '';
            exArray.forEach(ex => {
                html += `<div class="drawer-list-item" onclick="selectStatsEx('${ex}')">
                    ${ex}
                    ${currentStatsEx === ex ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
                </div>`;
            });
            openDrawer('Выберите упражнение', html);
        }

        function selectStatsEx(exName) {
            currentStatsEx = exName;
            document.getElementById('stats-selected-ex').innerText = exName;
            document.getElementById('stats-selected-ex').style.color = "var(--primary-color)";
            closeDrawer();
            renderStatsLog();
        }

        function renderStatsLog() {
            const container = document.getElementById('stats-log-container');
            if (!currentStatsEx) return;

            let html = '';
            for (let i = appData.history.length - 1; i >= 0; i--) {
                const session = appData.history[i];
                if (session.results[currentStatsEx] && session.results[currentStatsEx].length > 0) {
                    let setsStr = session.results[currentStatsEx].map(s => `<b>${s.w || 0}</b>x${s.r || 0}`).join(' &nbsp;|&nbsp; ');
                    html += `
                        <div class="history-entry">
                            <div class="history-date">${session.date}</div>
                            <div class="history-sets">${setsStr}</div>
                        </div>
                    `;
                }
            }
            container.innerHTML = html || '<p style="color: var(--text-muted); text-align: center; padding: 40px 0; font-weight: 500;">Нет сохраненных результатов.</p>';
        }

        // --- КАЛЕНДАРЬ И ИСТОРИЯ ---
        function changeMonth(delta) {
            currentCalDate.setMonth(currentCalDate.getMonth() + delta);
            renderHistoryTab();
        }

        function openDayHistory(timestampsStr) {
            const timestamps = JSON.parse(timestampsStr);
            const sessions = appData.history.filter(s => timestamps.includes(s.timestamp));
            if(sessions.length === 0) return;

            let html = '';
            sessions.forEach((session, idx) => {
                const dayConfig = appData.config.find(d => d.id === session.dayId);
                const dayName = dayConfig ? dayConfig.name : 'Удаленный день';

                html += `<div style="margin-bottom: 24px;">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
                        <span class="badge" style="margin:0;">${dayName}</span>
                    </div>`;
                
                for (const [exName, sets] of Object.entries(session.results)) {
                    let setsStr = sets.map(s => `<b>${s.w || 0}</b>x${s.r || 0}`).join(' | ');
                    html += `<div style="margin-bottom: 12px; background: var(--surface-light); padding: 12px; border-radius: 16px;">
                        <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500;">${exName}</div>
                        <div style="font-size: 16px; color: var(--text-main); font-weight: 400;">${setsStr}</div>
                    </div>`;
                }
                html += `</div>`;
            });
            
            // Название для шторки: "Тренировка за 12.05"
            openDrawer(`Итоги за ${sessions[0].date.substring(0,5)}`, html);
        }

        function renderHistoryTab() {
            // 1. РЕНДЕР КАЛЕНДАРЯ
            const calContainer = document.getElementById('calendar-container');
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay(); 
            let startDay = firstDay === 0 ? 6 : firstDay - 1; // Пн - первый день
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            
            let calHtml = `
                <div class="flex-between" style="margin-bottom: 20px;">
                    <button class="ghost" style="color: var(--text-muted); padding: 10px;" onclick="changeMonth(-1)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                    <h3 style="margin:0; font-size: 18px; color: var(--text-main);">${monthNames[month]} ${year}</h3>
                    <button class="ghost" style="color: var(--text-muted); padding: 10px;" onclick="changeMonth(1)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                </div>
                <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; margin-bottom: 12px;">
                    <div style="color: var(--text-muted); font-size: 12px; font-weight: 700;">ПН</div><div style="color: var(--text-muted); font-size: 12px; font-weight: 700;">ВТ</div><div style="color: var(--text-muted); font-size: 12px; font-weight: 700;">СР</div><div style="color: var(--text-muted); font-size: 12px; font-weight: 700;">ЧТ</div><div style="color: var(--text-muted); font-size: 12px; font-weight: 700;">ПТ</div><div style="color: var(--text-muted); font-size: 12px; font-weight: 700;">СБ</div><div style="color: var(--danger-color); font-size: 12px; font-weight: 700;">ВС</div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center;">
            `;

            for (let i = 0; i < startDay; i++) calHtml += `<div></div>`;

            for (let d = 1; d <= daysInMonth; d++) {
                const sessions = appData.history.filter(s => {
                    const sDate = new Date(s.timestamp);
                    return sDate.getDate() === d && sDate.getMonth() === month && sDate.getFullYear() === year;
                });

                if (sessions.length > 0) {
                    const sessionIds = JSON.stringify(sessions.map(s => s.timestamp));
                    calHtml += `<div onclick='openDayHistory("${sessionIds}")' style="background: var(--primary-color); color: var(--text-on-primary); border-radius: 12px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(212, 255, 58, 0.3);">${d}</div>`;
                } else {
                    calHtml += `<div style="background: var(--surface-light); color: var(--text-muted); border-radius: 12px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 16px;">${d}</div>`;
                }
            }
            calHtml += '</div>';
            calContainer.innerHTML = calHtml;

            // 2. РЕНДЕР ЛЕНТЫ ИСТОРИИ НИЖЕ
            const listContainer = document.getElementById('history-list-container');
            listContainer.innerHTML = '<h3 style="margin-top: 32px; margin-bottom: 16px; font-size: 20px;">Лента активности</h3>';

            if (appData.history.length === 0) {
                listContainer.innerHTML += '<div class="card"><p style="color: var(--text-muted); text-align: center; padding: 30px 0; font-weight: 500;">История тренировок пуста.</p></div>';
                return;
            }

            for (let i = appData.history.length - 1; i >= 0; i--) {
                const session = appData.history[i];
                const dayConfig = appData.config.find(d => d.id === session.dayId);
                const dayName = dayConfig ? dayConfig.name : 'Удаленный день';
                
                let exCount = Object.keys(session.results).length;
                let setsCount = 0;
                Object.values(session.results).forEach(s => setsCount += s.length);

                listContainer.innerHTML += `
                    <div class="card flex-between" style="padding: 20px; align-items: center;">
                        <div>
                            <div style="font-weight: 700; font-size: 16px; color: var(--text-main); margin-bottom: 4px;">${session.date}</div>
                            <div style="font-size: 14px; color: var(--primary-color); font-weight: 600;">${dayName}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">${exCount} упр. / ${setsCount} подх.</div>
                            <button class="ghost" style="color: var(--danger-color); font-size: 13px; padding: 0; width: auto; font-weight: 600;" onclick="deleteHistoryEntry(${i})">Удалить</button>
                        </div>
                    </div>
                `;
            }
        }

        function deleteHistoryEntry(index) {
            if(confirm("Точно удалить эту запись?")) {
                appData.history.splice(index, 1);
                saveData();
                renderHistoryTab(); 
            }
        }

        // --- СПЛИТ (НАСТРОЙКИ) ---
        function addDay() {
            const nameInput = document.getElementById('new-day-name');
            const name = nameInput.value.trim();
            if (!name) return;
            appData.config.push({ id: 'day_' + Date.now(), name: name, exercises: [] });
            nameInput.value = '';
            saveData();
        }

        function addExerciseToDay(dayId) {
            const input = document.getElementById(`new-ex-${dayId}`);
            const exName = input.value.trim();
            if (!exName) return;
            const day = appData.config.find(d => d.id === dayId);
            if (day && !day.exercises.includes(exName)) {
                day.exercises.push(exName);
                saveData();
            }
        }

        function removeExercise(dayId, exName) {
            if(confirm(`Удалить "${exName}"?`)) {
                const day = appData.config.find(d => d.id === dayId);
                day.exercises = day.exercises.filter(e => e !== exName);
                saveData();
            }
        }

        function deleteDay(dayId) {
            if(confirm("Полностью удалить этот день?")) {
                appData.config = appData.config.filter(d => d.id !== dayId);
                saveData();
            }
        }

        // --- ГЛАВНЫЙ РЕНДЕР ИНТЕРФЕЙСА ---
        function updateUI() {
            renderHighlightWidget(); // Обновляем виджет рекордов

            const configList = document.getElementById('config-days-list');
            const daySelector = document.getElementById('workout-day-selector');
            
            if (configList) {
                configList.innerHTML = '';
                appData.config.forEach(day => {
                    let exHtml = day.exercises.map(ex => `
                        <div class="flex-between" style="margin-bottom:12px; padding-bottom:12px; border-bottom: 1px solid rgba(255,255,255,0.05);">
                            <span style="font-size: 15px; line-height: 1.4; color: #ddd;">${ex}</span>
                            <button class="ghost" style="color: var(--text-muted); padding: 0 10px;" onclick="removeExercise('${day.id}', '${ex}')">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                    `).join('');
                    
                    configList.innerHTML += `
                        <div class="card">
                            <div class="flex-between" style="margin-bottom: 20px;">
                                <h3 style="margin:0; color: var(--text-main); font-size: 22px;">${day.name}</h3>
                                <button class="danger" style="width: 40px; height: 40px; padding: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center;" onclick="deleteDay('${day.id}')">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </button>
                            </div>
                            <div style="margin-bottom: 20px;">${exHtml}</div>
                            <div class="input-row" style="margin:0;">
                                <input type="text" id="new-ex-${day.id}" placeholder="Добавить упражнение" style="margin:0;">
                                <button class="secondary" style="width: 56px; height: 56px; border-radius: 16px; padding: 0;" onclick="addExerciseToDay('${day.id}')">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            if (daySelector) {
                daySelector.innerHTML = '';
                appData.config.forEach(day => {
                    daySelector.innerHTML += `
                    <button class="card" style="text-align: left; background-color: var(--surface-color); color: var(--text-main); font-size: 20px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;" onclick="startWorkout('${day.id}')">
                        ${day.name}
                        <div style="background: var(--primary-color); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </div>
                    </button>`;
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            
            // Фикс клавиатуры для iOS и закрытие шторки по клику на фон
            document.addEventListener('touchstart', (e) => {
                const tag = e.target.tagName;
                if (tag !== 'INPUT' && tag !== 'BUTTON' && tag !== 'SELECT') {
                    if (document.activeElement.tagName === 'INPUT') {
                        document.activeElement.blur();
                    }
                }
            });
        });
    </script>
</body>
</html>
